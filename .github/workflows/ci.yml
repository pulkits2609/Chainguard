name: ChainGuard CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PostgreSQL, backend, frontend and Ubuntu smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          # Public, disposable CI credentials. Never use these in a deployment.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-service-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LEDGER_DATABASE_URL: postgresql://chainguard_ci:ci-application-only-password@127.0.0.1:5432/chainguard
      LEDGER_TEST_DATABASE_URL: postgresql://chainguard_ci:ci-application-only-password@127.0.0.1:5432/chainguard_test
      LEDGER_BIND: 127.0.0.1
      LEDGER_PORT: '8765'
      LEDGER_ALLOWED_HOSTS: localhost,127.0.0.1
      LEDGER_PUBLIC_ORIGIN: http://127.0.0.1:8765
      LEDGER_DEV_MODE: 'true'
      LEDGER_SECURE_COOKIES: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the submitted commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the existing pinned dependencies
        run: |
          python -m pip install --requirement server/requirements.txt
          npm --prefix frontend ci
      - name: Create isolated databases with an ordinary application role
        env:
          PGPASSWORD: ci-service-only-password
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE chainguard_ci LOGIN PASSWORD 'ci-application-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE chainguard OWNER chainguard_ci;
          CREATE DATABASE chainguard_test OWNER chainguard_ci;
          SQL
      - name: Run every automated test and build the frontend
        run: python -B tools/run_checks.py --frontend
      - name: Check repeatable application initialization
        run: |
          python -B server/app.py --check-db
          python -B server/app.py --check-db
      - name: Smoke test Ubuntu startup, authenticated access and restart persistence
        run: |
          python - <<'PY'
          import http.client
          import json
          import os
          import secrets
          import subprocess
          import sys
          import time
          import uuid

          port = int(os.environ['LEDGER_PORT'])
          process = None

          def request(method, path, data=None, headers=None):
              connection = http.client.HTTPConnection('127.0.0.1', port, timeout=5)
              try:
                  body = json.dumps(data).encode() if data is not None else None
                  connection.request(method, path, body=body,
                      headers={'Content-Type': 'application/json', **(headers or {})})
                  response = connection.getresponse()
                  raw = response.read(1024 * 1024 + 1)
                  assert len(raw) <= 1024 * 1024, 'Smoke response exceeds its bound'
                  return response.status, json.loads(raw), dict(response.getheaders())
              finally:
                  connection.close()

          def start():
              child = subprocess.Popen([sys.executable, '-B', 'server/app.py'],
                  stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              try:
                  deadline = time.monotonic() + 20
                  while time.monotonic() < deadline:
                      if child.poll() is not None:
                          raise RuntimeError('Application exited during Ubuntu smoke startup')
                      try:
                          status, value, _ = request('GET', '/api/ledger-templates')
                          if status == 200 and len(value['templates']) == 4:
                              return child
                      except OSError:
                          pass
                      time.sleep(0.2)
                  raise RuntimeError('Application readiness timed out')
              except BaseException:
                  stop(child)
                  raise

          def stop(child):
              if child is None:
                  return
              child.terminate()
              try:
                  child.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  child.kill()
                  child.wait(timeout=5)
              if child.stdout:
                  child.stdout.close()

          def login(username, password):
              status, value, headers = request('POST', '/api/login',
                  {'username': username, 'password': password})
              assert status == 200, 'Existing account cannot log in after restart'
              return {'Cookie': headers['Set-Cookie'].split(';', 1)[0],
                      'X-CSRF-Token': value['csrf_token']}

          try:
              process = start()
              username, password = 'ci_' + uuid.uuid4().hex[:16], secrets.token_urlsafe(24)
              status, account, headers = request('POST', '/api/register',
                  {'username': username, 'password': password})
              assert status == 201, 'Account registration failed'
              session = {'Cookie': headers['Set-Cookie'].split(';', 1)[0],
                         'X-CSRF-Token': account['csrf_token']}
              status, created, _ = request('POST', '/api/ledgers',
                  {'name': 'CI startup fixture', 'description': 'Disposable hosted CI data',
                   'template_id': 'security_events'}, session)
              assert status == 201 and created['ledger']['visibility'] == 'private'
              ledger_id = created['ledger']['id']
              path = '/api/ledgers/' + ledger_id
              assert request('GET', path)[0] == 404, 'Private metadata is exposed anonymously'
              status, before, _ = request('GET', path, headers=session)
              assert status == 200 and before['verification']['valid']
              stop(process)
              process = None
              process = start()
              session = login(username, password)
              status, after, _ = request('GET', path, headers=session)
              assert status == 200 and after['verification']['valid']
              assert after['blocks'] == before['blocks'], 'Restart changed historical data'
              assert request('POST', '/api/logout', {}, session)[0] == 200
              print('Ubuntu application startup, authentication, private access and restart persistence: PASS')
          finally:
              stop(process)
          PY
      - name: Check deployment shell syntax
        run: |
          bash -n deploy/start-ubuntu.sh
          bash -n deploy/setup-ubuntu.sh
